<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light dark">
  <meta name="robots" content="noindex">
  <title>Page not found | urme</title>
  <link rel="icon" href="/portfolio/assets/brand-mark.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/portfolio/assets/brand-mark.svg">
  <script>
    (() => {
      const systemTheme = window.matchMedia("(prefers-color-scheme: dark)");
      let selectedTheme = null;
      try {
        const storedTheme = localStorage.getItem("theme");
        if (storedTheme === "dark" || storedTheme === "light") selectedTheme = storedTheme;
      } catch { }
      function applyTheme() {
        const dark = selectedTheme ? selectedTheme === "dark" : systemTheme.matches;
        document.documentElement.classList.toggle("dark-mode", dark);
        document.documentElement.style.colorScheme = dark ? "dark" : "light";
      }
      applyTheme();
      if (typeof systemTheme.addEventListener === "function") {
        systemTheme.addEventListener("change", applyTheme);
      }
      window.addEventListener("storage", event => {
        if (event.key !== "theme" && event.key !== null) return;
        try {
          if (event.storageArea && event.storageArea !== localStorage) return;
        } catch {
          return;
        }
        selectedTheme = event.newValue === "dark" || event.newValue === "light" ? event.newValue : null;
        applyTheme();
      });
    })();
  </script>
  <style>
    :root {
      --page-bg: #f7f6f1;
      --ink: #203239;
      --muted: #536369;
      --line: #d2d8ce;
      --accent: #1d625b;
      --button-ink: #f7f6f1;
    }
    :root.dark-mode {
      --page-bg: #152326;
      --ink: #edf0e7;
      --muted: #b5c4c1;
      --line: #3b5051;
      --accent: #a5d8c4;
      --button-ink: #152326;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--page-bg);
      color: var(--ink);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    .header {
      padding: 1.2rem 2rem;
      border-bottom: 1px solid var(--line);
    }

    .header a {
      display: flex;
      align-items: center;
      gap: 0.7rem;
      width: fit-content;
      color: inherit;
      text-decoration: none;
    }

    .header img {
      width: 36px;
      height: 36px;
    }

    :root.dark-mode .header img { filter: brightness(0) invert(1); }

    a:focus-visible { outline: 3px solid var(--accent); outline-offset: 4px; }

    .header span {
      font-size: 1.15rem;
    }

    .main {
      flex: 1;
      display: grid;
      place-items: center;
      padding: 3rem 2rem;
    }

    .wrap {
      max-width: 32rem;
      text-align: center;
    }

    .code {
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(5rem, 14vw, 8.5rem);
      font-weight: 700;
      line-height: 1;
      letter-spacing: -0.04em;
      color: var(--accent);
      margin: 0;
    }

    .title {
      font-size: clamp(1.4rem, 2.4vw, 1.7rem);
      font-weight: 700;
      letter-spacing: -0.01em;
      margin: 1.4rem 0 0.6rem;
    }

    .desc {
      color: var(--muted);
      font-size: 1.02rem;
      line-height: 1.6;
      margin: 0 0 2rem;
    }

    .links {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 0.5rem 0.4rem;
    }

    .links a {
      padding: 0.55rem 1.1rem;
      border: 1px solid var(--line);
      border-radius: 3px;
      color: var(--ink);
      text-decoration: none;
      font-size: 0.95rem;
      transition: border-color 0.2s ease, color 0.2s ease;
    }

    .links a.primary {
      background: var(--accent);
      border-color: var(--accent);
      color: var(--button-ink);
    }

    .links a:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .links a.primary:hover {
      opacity: 0.88;
      color: var(--button-ink);
    }

    .footer {
      padding: 1.4rem 2rem;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: 0.88rem;
      text-align: center;
    }

    @media (max-width: 480px) {
      .header { padding: 1rem 1.2rem; }
      .footer { padding: 1.2rem; }
    }

    @media (prefers-reduced-motion: reduce) {
      * { transition: none !important; }
    }
  </style>
</head>
<body>
  <header class="header">
    <a href="/portfolio/">
      <img src="/portfolio/assets/brand-mark.svg" alt="">
      <span>urme</span>
    </a>
  </header>

  <main class="main">
    <div class="wrap">
      <p class="code">404</p>
      <h1 class="title">Page not found</h1>
      <p class="desc">Check the address or choose a page below.</p>
      <div class="links">
        <a href="/portfolio/" class="primary">Research</a>
        <a href="/portfolio/#education">Education</a>
        <a href="/portfolio/#about">About</a>
      </div>
    </div>
  </main>

  <footer class="footer">
    <p>&copy; <span id="year"></span> urme</p>
  </footer>

  <script>
    document.getElementById("year").textContent = new Date().getFullYear();
  </script>
</body>
</html>
