<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" role="img" aria-labelledby="title desc">
  <title id="title">Project workflow</title>
  <desc id="desc">Signals, responses and documents pass through keyed scoring, held-out models or retrieval to produce score ranges, curves and sources.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#254f79"/>
    </marker>
  </defs>
  <rect width="960" height="420" rx="10" fill="#f5f5f7"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <text x="480" y="62" font-size="30" font-weight="700" fill="#1d1d1f">Project workflow</text>
    <g fill="#fff" stroke="#bac7d4" stroke-width="2">
      <rect x="30" y="114" width="262" height="240" rx="10"/>
      <rect x="349" y="114" width="262" height="240" rx="10"/>
      <rect x="668" y="114" width="262" height="240" rx="10"/>
    </g>
    <g stroke="#254f79" stroke-width="3" marker-end="url(#arrow)">
      <path d="M 298 234 H 337"/>
      <path d="M 617 234 H 656"/>
    </g>
    <g font-size="27" font-weight="700" fill="#254f79">
      <text x="161" y="163">Inputs</text>
      <text x="480" y="163">Methods</text>
      <text x="799" y="163">Reports</text>
    </g>
    <g font-size="23" fill="#1d1d1f">
      <text x="161" y="220">Signals</text>
      <text x="161" y="264">Responses</text>
      <text x="161" y="308">Documents</text>
      <text x="480" y="220">Keyed scoring</text>
      <text x="480" y="264">Held-out models</text>
      <text x="480" y="308">Retrieval</text>
      <text x="799" y="220">Score ranges</text>
      <text x="799" y="264">Curves</text>
      <text x="799" y="308">Sources</text>
    </g>
  </g>
</svg>
